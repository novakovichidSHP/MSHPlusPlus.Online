# GitLab CI — зеркало GitHub Actions: unit-тесты, coverage, browser smoke и API-доки.
# Тулчейн C++ (/toolchain, ~356 МБ) нужен только browser smoke.

stages:
  - test
  - docs

default:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

unit:
  stage: test
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test:unit
    - npm run test:unit:coverage
  # GitLab берёт % из лога c8 (строка «All files | 98.39 | …»)
  coverage: '/All files\s*\|\s*([0-9.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

smoke:
  stage: test
  needs: ["unit"]
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright install --with-deps chromium
  script:
    - npm run test:smoke
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - test-results/
      - playwright-report/

docs:
  stage: docs
  needs: ["unit", "smoke"]
  rules:
    # Не зацикливаемся на авто-коммитах доков; только на пушах в ветку.
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE !~ /docs: auto-update API docs/'
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run docs:api
    - npx jsdoc -X -c jsdoc.json > jsdoc-report.json
    - node scripts/check-api-docs.mjs jsdoc-report.json
  artifacts:
    expire_in: 1 week
    paths:
      - docs/api/
  # Авто-коммит доков обратно в репо на GitLab требует PROJECT ACCESS TOKEN
  # (CI_JOB_TOKEN пушить не может). Пока доки публикуются как артефакт.
